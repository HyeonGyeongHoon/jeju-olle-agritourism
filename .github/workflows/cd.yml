name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Debug SSH connection
      run: |
        echo "$SSH_KEY" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -vvv $USER@$HOST "echo CONNECTED" || true
      env:
        SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
        USER: ${{ secrets.GCP_VM_USERNAME }}
        HOST: ${{ secrets.GCP_VM_IP }}

    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_VM_USERNAME }}
        key: ${{ secrets.GCP_VM_SSH_KEY }}
        script: |
          # 1. 배포 경로 이동
          cd /home/${{ secrets.GCP_VM_USERNAME }}/app/jeju-olle-agritourism
          
          # 2. 브랜치 최신화 및 소스 코드 가져오기 (로컬 강제 동기화)
          git fetch origin main
          git reset --hard origin/main
          
          # 3. 환경 변수 .env 동적 생성
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}" >> .env
          echo "VISIT_JEJU_API_KEY=${{ secrets.VISIT_JEJU_API_KEY }}" >> .env
          
          # 4. 이미지 로컬 빌드 및 컨테이너 재기동
          docker compose -f docker-compose.prod.yml up -d --build
          
          # 5. 미사용 이미지 정리 (서버 용량 관리용)
          docker image prune -f
