version: '3.8'

services:
  api:
    image: asia-northeast3-docker.pkg.dev/${GCP_PROJECT_ID}/jeju-olle-repo/jeju-olle-docent:latest
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY}
      - VISIT_JEJU_API_KEY=${VISIT_JEJU_API_KEY}
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
    restart: always

  web:
    image: asia-northeast3-docker.pkg.dev/${GCP_PROJECT_ID}/jeju-olle-repo/jeju-olle-docent:latest
    ports:
      - "8501:8501"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY}
      - VISIT_JEJU_API_KEY=${VISIT_JEJU_API_KEY}
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    restart: always
